<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>MultiRadios.es - Escucha Radios en Vivo</title>
  <meta name="description" content="Escucha en vivo las mejores radios online. Reproductor premium con emisoras de España, Paraguay, Argentina y más.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MultiRadios.es">
  <meta property="og:title" content="MultiRadios.es | Escucha radios en vivo">
  <meta property="og:description" content="Te invito a escuchar las mejores radios online en directo. ¡Reproductor premium gratis!">
  <meta property="og:image" content="https://i.ibb.co/LhDPnt7b/N.png">
  <meta name="theme-color" content="#0B0E14" id="metaThemeColor">
  <link rel="icon" type="image/png" href="https://i.ibb.co/LhDPnt7b/N.png" id="faviconLink">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MultiRadios">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontLink" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

  <style>
    :root{
      --accent:#22D3EE; --accent-strong:#06B6D4; --accent-soft:rgba(34,211,238,.14);
      --bg:#0B0E14; --sidebar:#090C12; --surface:#131722; --surface-2:#1A1F2E; --elev:#242A3A;
      --text:#F1F5F9; --muted:#8B93A7; --border:rgba(255,255,255,.06); --player-bg:#0C0F16;
      --font:'Poppins',sans-serif; --font-body:'Manrope',sans-serif; --radius:16px;
      
      /* VARIABLES DINÁMICAS (Se actualizan según la carátula) */
      --radio-accent:#FF2956; 
      --radio-accent-soft:rgba(255,41,86,0.3);
      --bg-gradient:linear-gradient(180deg, var(--radio-accent-soft) 0%, rgba(15,15,17,.85) 50%, rgba(10,10,12,.98) 100%);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;width:100%;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#252b3a;border-radius:20px;}
    ::-webkit-scrollbar-thumb:hover{background:#333a4d;}
    a{color:inherit;text-decoration:none;}

    .app{display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh;gap:8px;padding:8px 8px calc(86px + 8px);}

    /* SIDEBAR */
    .sidebar{background:var(--sidebar);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);transition:transform .3s cubic-bezier(.4,0,.2,1);}
    .brand{display:flex;align-items:center;gap:12px;padding:22px 20px 14px;}
    .brand .mark{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:linear-gradient(145deg,var(--accent),var(--accent-strong));display:grid;place-items:center;color:#04121a;font-size:1.2rem;box-shadow:0 6px 18px rgba(34,211,238,.4);}
    .brand .logo{font-family:var(--font);font-weight:800;font-size:1.2rem;letter-spacing:-.5px;line-height:1;text-transform:uppercase;}
    .brand .logo span{color:var(--accent);}
    .side-close{display:none;margin-left:auto;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;}

    .side-scroll{flex:1;overflow-y:auto;padding:6px 12px 12px;}
    .side-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;padding:16px 14px 8px;opacity:.65;}
    .nav-item{display:flex;align-items:center;gap:15px;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem;transition:background .18s,color .18s;border:none;background:none;text-align:left;width:100%;font-family:var(--font-body);}
    .nav-item i{font-size:1.1rem;width:22px;text-align:center;}
    .nav-item:hover{color:var(--text);background:rgba(255,255,255,.04);}
    .nav-item.active{color:#04121a;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 6px 16px rgba(34,211,238,.3);}
    .nav-item.active i{color:#04121a;}

    /* MAIN */
    .main{background:var(--surface);border-radius:20px;overflow:hidden;min-height:0;min-width:0;display:flex;flex-direction:column;position:relative;border:1px solid var(--border);}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:16px 26px;background:rgba(19,23,34,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
    .hamburger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:1.1rem;}
    .mobile-brand{display:none;align-items:center;gap:9px;}
    .mobile-brand .logo{font-family:var(--font);font-weight:800;font-size:1.05rem;text-transform:uppercase;}
    .mobile-brand .logo span{color:var(--accent);}
    
    .search-box{flex:1;max-width:440px;position:relative;}
    .search-box input{width:100%;background:var(--surface-2);border:1px solid var(--border);padding:13px 44px 13px 46px;border-radius:30px;color:var(--text);font-family:var(--font-body);font-size:.95rem;transition:border-color .2s,background .2s;}
    .search-box input::placeholder{color:var(--muted);}
    .search-box input:focus{outline:none;border-color:var(--accent);background:#1e2434;}
    .search-box .s-ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);}

    .content{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;padding:6px 26px 30px;}

    /* GRID DE RADIOS */
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:24px 0 16px;}
    .section-head h2{font-size:1.4rem;font-weight:800;letter-spacing:-.5px;}

    .radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
    .radio-card{background:var(--surface-2);border-radius:var(--radius);padding:14px;cursor:pointer;transition:background .2s,transform .15s;position:relative;border:1px solid transparent;min-width:0;}
    .radio-card:hover{background:var(--elev);transform:translateY(-3px);}
    .radio-card.active{border-color:var(--accent);background:var(--accent-soft);}
    .card-art{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#1e2434,#12151f);position:relative;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.35);}
    .card-art img{width:100%;height:100%;object-fit:cover;}
    .card-play{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#04121a;display:grid;place-items:center;font-size:1rem;box-shadow:0 8px 18px rgba(34,211,238,.45);opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;border:none;cursor:pointer;}
    .radio-card:hover .card-play, .radio-card.active .card-play{opacity:1;transform:translateY(0);}
    .card-title{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font);}
    .card-meta{font-size:.76rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* MINI PLAYER BAR */
    .player-bar{position:fixed;bottom:8px;left:8px;right:8px;height:80px;background:var(--player-bg);border:1px solid var(--border);border-radius:20px;z-index:500;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;box-shadow:0 -4px 30px rgba(0,0,0,.4);gap:16px;}
    .track-info{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer;}
    .track-info .art{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#1e2434;}
    .track-info .txt{min-width:0;}
    .track-info b{display:block;font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font);}
    .track-info span{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
    .controls{display:flex;align-items:center;gap:16px;}
    .btn-nav{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;transition:color .18s;}
    .btn-nav:hover{color:var(--text);}
    .p-play{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#04121a;display:grid;place-items:center;font-size:1.2rem;cursor:pointer;border:none;transition:transform .12s;box-shadow:0 6px 20px rgba(34,211,238,.45);}
    .p-play:hover{transform:scale(1.05);}
    .player-right{display:flex;align-items:center;justify-content:flex-end;gap:12px;}
    .vol-cont{display:flex;align-items:center;gap:8px;}
    .vol-cont i{color:var(--muted);font-size:.88rem;}
    input[type=range].vol{-webkit-appearance:none;appearance:none;width:90px;height:5px;border-radius:10px;background:linear-gradient(90deg,var(--accent) 80%,#2a3040 80%);cursor:pointer;}
    input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;}

    /* ==========================================================
       FULL PLAYER INMERSIVO (DISCO 100% CUBIERTO Y COLOR DINÁMICO)
       ========================================================== */
    .full-player{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;background:#0d0d0f;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);overflow:hidden;}
    .full-player.open{transform:translateY(0);}

    .fp-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.85;}
    .fp-color-overlay{position:absolute;inset:0;z-index:2;background:var(--bg-gradient);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:background 0.5s ease;}

    /* ECUALIZADOR INFERIOR CON COLOR DINÁMICO */
    .fp-wave-container{position:absolute;bottom:0;left:0;right:0;height:35%;display:flex;align-items:flex-end;justify-content:space-between;gap:2px;z-index:3;pointer-events:none;padding:0;}
    .fp-wave-container .wave-bar{flex:1;height:10%;border-radius:3px 3px 0 0;background:var(--radio-accent);box-shadow: 0 0 12px var(--radio-accent);transition:height .05s ease, background 0.5s ease;}

    /* CAPA UI */
    .fp-ui{position:relative;z-index:4;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px) 20px;max-width:540px;margin:0 auto;}

    /* CABECERA */
    .fp-header{display:flex;justify-content:space-between;align-items:center;width:100%;}
    .fp-top-logo{width:48px;height:48px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:50%;display:flex;justify-content:center;align-items:center;border:1.5px solid rgba(255,255,255,.35);overflow:hidden;}
    .fp-top-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .fp-close-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;font-size:1rem;display:grid;place-items:center;}

    /* ZONA CENTRAL: DISCO DE VINILO COMPLETAMENTE CUBIERTO CON EL LOGO */
    .fp-center{display:flex;justify-content:center;align-items:center;flex:1;position:relative;width:100%;}
    .fp-album-wrap{position:relative;width:210px;height:210px;aspect-ratio:1/1;}
    
    /* DISCO DE VINILO: EL LOGO CUBRE EL 100% DEL DISCO */
    .fp-vinyl{
      position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--radio-accent-soft);
      transition: transform 0.8s cubic-bezier(.175,.885,.32,1.275);
      border: 3px solid rgba(255,255,255,0.2); 
      display:flex; justify-content:center; align-items:center; will-change:transform;
    }
    
    /* LA IMAGEN DEL LOGO / CARÁTULA OCUPA EL 100% DEL DISCO */
    .fp-vinyl img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* EFECTO DE AGUJERO CENTRAL Y SURCOS DEL DISCO DE VINILO */
    .fp-vinyl::after{
      content:''; position:absolute; inset:0; border-radius:50%;
      background: radial-gradient(circle, #000 0%, #000 5%, transparent 6%, transparent 40%, rgba(0,0,0,0.3) 41%, transparent 42%, transparent 70%, rgba(0,0,0,0.4) 71%, transparent 72%);
      pointer-events:none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    /* CARÁTULA CUADRADA FRONTAL DE LA RADIO */
    .fp-cover{
      position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;
      overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.2);
      z-index:2;background:#1e1e22;
    }
    .fp-cover img{width:100%;height:100%;object-fit:cover;}

    /* Animación del Vinilo rodando */
    .full-player.playing .fp-vinyl{transform:translateX(85px);animation:fpSpin 3s linear infinite;}
    @keyframes fpSpin{from{transform:translateX(85px) rotate(0deg);}to{transform:translateX(85px) rotate(360deg);}}

    /* ZONA INFERIOR: INFO Y CONTROLES SEPARADOS */
    .fp-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2;}
    
    .fp-info-bar{
      width:100%;height:62px;background:rgba(17,17,19,0.85);backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);border-radius:35px;display:flex;align-items:center;
      padding:0 16px;border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 25px rgba(0,0,0,0.5);
    }
    .fp-station-avatar{width:42px;height:42px;background:#fff;border-radius:50%;margin-right:12px;overflow:hidden;flex-shrink:0;border:1.5px solid var(--radio-accent);transition:border-color 0.5s ease;}
    .fp-station-avatar img{width:100%;height:100%;object-fit:cover;}
    .fp-info-text{flex:1;overflow:hidden;}
    .fp-info-text .fp-title-main{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font);}
    .fp-info-text .fp-sub-line{color:rgba(255,255,255,0.7);font-size:11px;}

    /* CONTROLES DE REPRODUCCIÓN CENTRADOS EN SU PROPIA FILA */
    .fp-main-controls{
      display:flex; width:100%; justify-content:center; align-items:center; gap:16px;
    }
    .fp-btn-play{
      width:70px; height:70px; background:#ffffff; border-radius:50%; display:flex;
      justify-content:center; align-items:center; font-size:26px; color:var(--radio-accent);
      border:none; box-shadow:0 6px 20px rgba(0,0,0,0.4); cursor:pointer; transition:transform 0.2s ease, color 0.5s ease;
    }
    .fp-btn-play:active{transform:scale(0.92);}
    .fp-btn-nav{
      width:48px; height:48px; background:rgba(17,17,19,0.85); backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px); border-radius:50%; color:white; display:flex;
      justify-content:center; align-items:center; font-size:18px; border:1px solid rgba(255,255,255,0.15);
      cursor:pointer; transition:background 0.2s ease, transform 0.1s ease;
    }
    .fp-btn-nav:active{transform:scale(0.92);}

    /* FILA SEPARADA PARA REDES SOCIALES ABAJO */
    .fp-social-row{
      display:flex; width:100%; justify-content:center; align-items:center; gap:14px; margin-top:2px;
    }
    .fp-btn-social{
      width:44px; height:44px; background:rgba(17,17,19,0.85); backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px); border-radius:50%; color:white; display:flex;
      justify-content:center; align-items:center; font-size:18px; border:1px solid rgba(255,255,255,0.15);
      cursor:pointer; transition:all 0.2s ease; text-decoration:none;
    }
    .fp-btn-social:hover{background:var(--radio-accent); border-color:var(--radio-accent);}
    .fp-btn-social:active{transform:scale(0.92);}

    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:449;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;}
    .scrim.show{opacity:1;visibility:visible;}

    /* MEDIA QUERIES PARA ADAPTACIÓN */
    @media(min-width:768px){
      .fp-album-wrap{width:260px;height:260px;}
      .full-player.playing .fp-vinyl{transform:translateX(110px);}
      @keyframes fpSpin{from{transform:translateX(110px) rotate(0deg);}to{transform:translateX(110px) rotate(360deg);}}
      .fp-info-bar{height:70px;}
      .fp-btn-play{width:76px;height:76px;font-size:30px;}
      .fp-btn-nav{width:54px;height:54px;font-size:20px;}
      .fp-btn-social{width:48px;height:48px;font-size:20px;}
    }

    @media(max-width:900px){
      .app{display:block;height:auto;padding:0 0 calc(90px + env(safe-area-inset-bottom));}
      .sidebar{position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:310px;z-index:1500;border-radius:0 20px 20px 0;transform:translateX(-105%);}
      .sidebar.open{transform:translateX(0);}
      .side-close{display:block;}
      .main{border-radius:0;border:none;background:var(--bg);}
      .topbar{padding:12px 14px;gap:10px;}
      .hamburger{display:grid;place-items:center;}
      .mobile-brand{display:flex;flex:1;}
      .content{padding:4px 14px 20px;}
      .radio-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
      .radio-card{padding:8px;}
      .card-play{opacity:1;transform:none;width:36px;height:36px;font-size:.82rem;}
      .player-bar{left:0;right:0;bottom:0;border-radius:18px 18px 0 0;grid-template-columns:1fr auto;height:72px;padding:0 12px;}
      .player-bar .player-right{display:none;}
    }
    @media(max-width:400px){.radio-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  </style>
</head>
<body>

  <div class="scrim" id="scrim"></div>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="mark"><i class="fas fa-radio"></i></div>
        <div class="logo">Multi<span>Radios</span></div>
        <button class="side-close" id="sideClose"><i class="fas fa-times"></i></button>
      </div>

      <div class="side-scroll">
        <div class="side-label">Navegación</div>
        <button class="nav-item active"><i class="fas fa-play-circle"></i> En Vivo</button>
        <button class="nav-item"><i class="fas fa-heart"></i> Favoritos</button>
        <button class="nav-item"><i class="fas fa-fire"></i> Lo más viral</button>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <div class="mobile-brand">
          <div class="logo">Multi<span>Radios</span></div>
        </div>
        <div class="search-box">
          <i class="fas fa-search s-ico"></i>
          <input type="text" id="searchInput" placeholder="Buscar emisora o género...">
        </div>
      </header>

      <section class="content">
        <div class="section-head">
          <div>
            <h2>Emisoras Destacadas</h2>
            <p style="color:var(--muted); font-size:12px;">Sintoniza tus estaciones favoritas en tiempo real</p>
          </div>
        </div>

        <div class="radio-grid" id="radioGrid">
          <!-- Las tarjetas de radio se generan dinámicamente -->
        </div>
      </section>
    </main>
  </div>

  <!-- BARRA INFERIOR DE REPRODUCCIÓN (MINI PLAYER) -->
  <div class="player-bar">
    <div class="track-info" id="miniPlayerTrackInfo">
      <img src="https://i.ibb.co/LhDPnt7b/N.png" class="art" id="miniLogo" alt="Cover">
      <div class="txt">
        <b id="miniTitle">RADIO PARTY VALENCIA</b>
        <span id="miniSub">En Vivo - La Radio Online</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-nav" id="miniPrev" title="Anterior"><i class="fas fa-backward-step"></i></button>
      <button class="p-play" id="miniPlay" title="Reproducir/Pausar"><i class="fas fa-play" id="miniPlayIcon"></i></button>
      <button class="btn-nav" id="miniNext" title="Siguiente"><i class="fas fa-forward-step"></i></button>
    </div>

    <div class="player-right">
      <div class="vol-cont">
        <i class="fas fa-volume-high"></i>
        <input type="range" class="vol" id="volRange" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <!-- FULL PLAYER INMERSIVO -->
  <div class="full-player" id="fullPlayer">
    <!-- Video de fondo -->
    <video class="fp-video" autoplay loop muted playsinline>
      <source src="https://github.com/MorelDa/nuevo-pwa-para-wilmer/raw/refs/heads/main/WhatsApp%20Video%202026-08-03%20at%2009.30.41.mp4" type="video/mp4">
    </video>

    <div class="fp-color-overlay"></div>

    <!-- ECUALIZADOR DINÁMICO DE BARRAS -->
    <div class="fp-wave-container" id="fpWaveContainer"></div>

    <div class="fp-ui">
      <!-- CABECERA DE FULL PLAYER -->
      <div class="fp-header">
        <div class="fp-top-logo">
          <img src="https://i.ibb.co/LhDPnt7b/N.png" id="fpTopLogo" alt="Logo">
        </div>
        <button class="fp-close-btn" id="fpCloseBtn"><i class="fas fa-chevron-down"></i></button>
      </div>

      <!-- SECCIÓN CENTRAL CENTRADA: VINILO 100% CUBIERTO Y PORTADA -->
      <div class="fp-center">
        <div class="fp-album-wrap">
          <!-- Vinilo: El Logo ocupa el 100% del disco -->
          <div class="fp-vinyl" id="fpVinyl">
            <img src="https://i.ibb.co/LhDPnt7b/N.png" id="fpVinylLogo" alt="Disco Vinilo Completo">
          </div>
          <!-- Carátula frontal -->
          <div class="fp-cover">
            <img src="https://i.ibb.co/LhDPnt7b/N.png" id="fpCoverImg" alt="Portada Radio">
          </div>
        </div>
      </div>

      <!-- CONTROLES E INFORMACIÓN INFERIOR -->
      <div class="fp-bottom">
        <div class="fp-info-bar">
          <div class="fp-station-avatar">
            <img src="https://i.ibb.co/LhDPnt7b/N.png" id="fpAvatar" alt="Avatar">
          </div>
          <div class="fp-info-text">
            <div class="fp-title-main" id="fpTitle">RADIO PARTY VALENCIA</div>
            <div class="fp-sub-line" id="fpSub">En Vivo - La Radio Online</div>
          </div>
        </div>

        <!-- FILA DE CONTROLES PRINCIPALES CENTRADOS -->
        <div class="fp-main-controls">
          <button class="fp-btn-nav" id="fpPrev" title="Anterior">
            <i class="fa-solid fa-backward-step"></i>
          </button>

          <button class="fp-btn-play" id="fpPlay" title="Reproducir/Pausar">
            <i class="fa-solid fa-play" id="fpPlayIcon"></i>
          </button>

          <button class="fp-btn-nav" id="fpNext" title="Siguiente">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <!-- FILA SEPARADA PARA REDES SOCIALES ABAJO -->
        <div class="fp-social-row">
          <a class="fp-btn-social" href="https://wa.me/" target="_blank" title="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
          </a>
          <a class="fp-btn-social" href="https://www.instagram.com/" target="_blank" title="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a class="fp-btn-social" href="https://www.facebook.com/" target="_blank" title="Facebook">
            <i class="fa-brands fa-facebook"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

<script>
// BASE DE DATOS DE EMISORAS
const STATIONS = [
  {
    id: 'party-valencia',
    name: 'RADIO PARTY VALENCIA',
    subtitle: 'En Vivo - La Radio Online',
    logo: 'https://i.ibb.co/LhDPnt7b/N.png',
    url: 'https://miestacion.turadioonline.com.ar:8286/stream'
  },
  {
    id: 'top-40',
    name: 'Éxitos Hit Radio',
    subtitle: 'Pop & Dance 24/7',
    logo: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80',
    url: 'https://stream.zeno.fm/f3fb44chc8quv'
  },
  {
    id: 'urban-mix',
    name: 'Urban Beats Live',
    subtitle: 'Reggaeton & Trap Hits',
    logo: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80',
    url: 'https://stream.zeno.fm/0r0xa792kwzuv'
  }
];

let currentIndex = 0;
let isPlaying = false;
let audioCtx, analyser, dataArray;

const audio = new Audio();
audio.crossOrigin = "anonymous";

// ELEMENTOS DOM
const radioGrid = document.getElementById('radioGrid');
const fullPlayer = document.getElementById('fullPlayer');

const miniTitle = document.getElementById('miniTitle');
const miniSub = document.getElementById('miniSub');
const miniLogo = document.getElementById('miniLogo');
const miniPlay = document.getElementById('miniPlay');
const miniPlayIcon = document.getElementById('miniPlayIcon');

const fpTitle = document.getElementById('fpTitle');
const fpSub = document.getElementById('fpSub');
const fpAvatar = document.getElementById('fpAvatar');
const fpCoverImg = document.getElementById('fpCoverImg');
const fpTopLogo = document.getElementById('fpTopLogo');
const fpVinylLogo = document.getElementById('fpVinylLogo');
const fpPlay = document.getElementById('fpPlay');
const fpPlayIcon = document.getElementById('fpPlayIcon');

// CREACIÓN DE BARRAS DEL ECUALIZADOR DINÁMICO
const waveContainer = document.getElementById('fpWaveContainer');
const BARS_COUNT = 32;
const waveBars = [];

for (let i = 0; i < BARS_COUNT; i++) {
  const bar = document.createElement('div');
  bar.classList.add('wave-bar');
  waveContainer.appendChild(bar);
  waveBars.push(bar);
}

// ALGORITMO DE EXTRACCIÓN AUTOMÁTICA DE COLOR DESDE EL LOGO/IMAGEN
function extractColorFromImage(imageUrl) {
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.src = imageUrl;
  img.onload = function() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 50;
    canvas.height = 50;
    ctx.drawImage(img, 0, 0, 50, 50);

    const imgData = ctx.getImageData(0, 0, 50, 50).data;
    let r = 0, g = 0, b = 0, count = 0;

    for (let i = 0; i < imgData.length; i += 16) {
      // Filtrar colores demasiado oscuros o negros
      if (imgData[i] > 30 || imgData[i+1] > 30 || imgData[i+2] > 30) {
        r += imgData[i];
        g += imgData[i+1];
        b += imgData[i+2];
        count++;
      }
    }

    if (count > 0) {
      r = Math.floor(r / count);
      g = Math.floor(g / count);
      b = Math.floor(b / count);
    } else {
      r = 255; g = 41; b = 86; // Color fallback
    }

    // Aplicar colores extraídos a las variables CSS
    document.documentElement.style.setProperty('--radio-accent', `rgb(${r}, ${g}, ${b})`);
    document.documentElement.style.setProperty('--radio-accent-soft', `rgba(${r}, ${g}, ${b}, 0.35)`);
  };
}

// RENDERIZAR PARRILLA DE RADIOS
function renderRadios() {
  radioGrid.innerHTML = '';
  STATIONS.forEach((st, idx) => {
    const card = document.createElement('div');
    card.className = `radio-card ${idx === currentIndex ? 'active' : ''}`;
    card.onclick = () => selectStation(idx);

    card.innerHTML = `
      <div class="card-art">
        <img src="${st.logo}" alt="${st.name}">
        <button class="card-play"><i class="fas ${idx === currentIndex && isPlaying ? 'fa-pause' : 'fa-play'}"></i></button>
      </div>
      <div class="card-title">${st.name}</div>
      <div class="card-meta">${st.subtitle}</div>
    `;
    radioGrid.appendChild(card);
  });
}

// SELECCIONAR EMISORA
function selectStation(index) {
  currentIndex = index;
  const st = STATIONS[currentIndex];

  audio.src = st.url;
  
  // Extraer color automáticamente de la imagen del logo
  extractColorFromImage(st.logo);

  // Actualizar Mini Player
  miniTitle.textContent = st.name;
  miniSub.textContent = st.subtitle;
  miniLogo.src = st.logo;

  // Actualizar Full Player
  fpTitle.textContent = st.name;
  fpSub.textContent = st.subtitle;
  fpAvatar.src = st.logo;
  fpCoverImg.src = st.logo;
  fpTopLogo.src = st.logo;
  fpVinylLogo.src = st.logo;

  renderRadios();
  togglePlay(true);
}

// INICIALIZAR ANALIZADOR DE AUDIO
function initAnalyser() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
}

// CONTROL DE REPRODUCCIÓN
function togglePlay(forcePlay = false) {
  initAnalyser();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  if (forcePlay || !isPlaying) {
    audio.play().then(() => {
      isPlaying = true;
      updatePlayStateUI();
    }).catch(err => console.log("Error de reproducción:", err));
  } else {
    audio.pause();
    isPlaying = false;
    updatePlayStateUI();
  }
}

function updatePlayStateUI() {
  const iconClass = isPlaying ? "fa-pause" : "fa-play";
  miniPlayIcon.className = `fas ${iconClass}`;
  fpPlayIcon.className = `fa-solid ${iconClass}`;

  if (isPlaying) {
    fullPlayer.classList.add("playing");
  } else {
    fullPlayer.classList.remove("playing");
  }
  renderRadios();
}

// ANIMACIÓN DE LAS BARRAS DEL ECUALIZADOR
function animateWaves() {
  if (isPlaying && analyser) {
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    let avg = sum / dataArray.length;

    waveBars.forEach((bar, index) => {
      let raw = dataArray[index % dataArray.length] || 0;
      let val = (raw * 0.4) + (avg * 0.6);
      let dynamicFactor = Math.sin(index * 0.5 + Date.now() * 0.015) * 12;
      let height = ((val / 255) * 85) + 10 + dynamicFactor;

      if (height > 100) height = 100;
      if (height < 10) height = 10;

      bar.style.height = `${height}%`;
    });
  } else {
    waveBars.forEach(bar => bar.style.height = '10%');
  }
  requestAnimationFrame(animateWaves);
}
animateWaves();

// EVENTOS DE BOTONES
miniPlay.onclick = () => togglePlay();
fpPlay.onclick = () => togglePlay();

document.getElementById('miniPrev').onclick = document.getElementById('fpPrev').onclick = () => {
  let prev = currentIndex - 1 < 0 ? STATIONS.length - 1 : currentIndex - 1;
  selectStation(prev);
};

document.getElementById('miniNext').onclick = document.getElementById('fpNext').onclick = () => {
  let next = (currentIndex + 1) % STATIONS.length;
  selectStation(next);
};

// CONTROLES DE ABRIR/CERRAR FULL PLAYER
document.getElementById('miniPlayerTrackInfo').onclick = () => {
  fullPlayer.classList.add('open');
};

document.getElementById('fpCloseBtn').onclick = () => {
  fullPlayer.classList.remove('open');
};

// CONTROL DE VOLUMEN
document.getElementById('volRange').oninput = (e) => {
  audio.volume = e.target.value;
};

// MENU LATERAL MOBILE
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');

document.getElementById('hamburger').onclick = () => {
  sidebar.classList.add('open');
  scrim.classList.add('show');
};

document.getElementById('sideClose').onclick = scrim.onclick = () => {
  sidebar.classList.remove('open');
  scrim.classList.remove('show');
};

// INICIALIZACIÓN
selectStation(0);
</script>
</body>
</html>
